query getOrder($query: String) {
  orders(first: 1, query: $query) {
    nodes {
      id
      name
      createdAt
      lineItems(first: 100) {
        nodes {
          sku
          discountedUnitPriceAfterAllDiscountsSet {
            presentmentMoney {
              amount
            }
          }
        }
      }
    }
  }
}
